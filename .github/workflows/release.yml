# Release pipeline for z2m-guard: tag -> musl binaries (amd64 + arm64), SBOM,
# licence notices, multi-arch image on GHCR, draft release with all assets.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            cross: true
          - target: aarch64-unknown-linux-musl
            cross: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # cross-rs runs the build in its own container: correct musl toolchain for
      # both architectures without hand-installed cross compilers.
      - name: Install cross
        run: cargo install cross --locked
      - name: Build (static musl)
        run: cross build --release --target ${{ matrix.target }} -p z2m-guard
      - name: Package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BIN="z2m-guard-${VERSION}-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/z2m-guard" "$BIN"
          sha256sum "$BIN" > "$BIN.sha256"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: |
            ${{ env.BIN }}
            ${{ env.BIN }}.sha256

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          # this cargo-cyclonedx has no --output-cdx: it writes next to the manifest
          cargo cyclonedx --manifest-path crates/z2m-guard/Cargo.toml \
            --format json --spec-version 1.5
          mv crates/z2m-guard/z2m-guard.cdx.json "z2m-guard-${GITHUB_REF_NAME#v}.cdx.json"
      - name: Third-party licence notices
        run: |
          python3 scripts/license-notices.py
          cp LICENSE-MIT LICENSE-APACHE dist/
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            z2m-guard-*.cdx.json
            dist/THIRD-PARTY-LICENSES.txt
            dist/LICENSE-MIT
            dist/LICENSE-APACHE

  # Without this job the README claim ("a multi-arch image ships with every tag")
  # was only true for whoever built it by hand: the local buildx run produced an
  # OCI archive and nothing published it anywhere.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR requires a lowercase owner: the account is St0pfen, the image
          # namespace must be st0pfen.
          images: ghcr.io/st0pfen/z2m-guard
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Record the digest for the release notes
        run: |
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [build, sbom, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*