name: ci

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features

  # The 0.1.1 artifact linked rustls-webpki 0.102.8 with eight open advisories and
  # nobody noticed until the release SBOM was scanned by hand. An advisory is a
  # red build from now on.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - name: Advisory scan (locked tree)
        run: cargo audit --deny warnings

  # The build can succeed while the image cannot start: the build stage's base
  # image moved from bookworm to trixie upstream and linked glibc 2.38, the
  # distroless runtime ships 2.36, and the container died with "GLIBC_2.38 not
  # found". A green `docker build` proves nothing — this job runs the thing.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: z2m-guard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image must actually run
        run: docker run --rm z2m-guard:ci --version

  # rust-version in Cargo.toml is a promise, not a comment: CHANGELOG entries have
  # claimed MSRV 1.85 before while nothing enforced it. This job builds the locked
  # tree on exactly that toolchain (1.85 cannot run edition2024 dependencies, so a
  # silent bump breaks here instead of in someone's distribution build).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.85
      - name: Build on the declared MSRV
        run: cargo +1.85.0 check --workspace --all-features --locked