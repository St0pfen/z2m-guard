# Prometheus scrape snippet for z2m-guard.
#
# The guard publishes no host port: scrape it over the internal Docker network.
# If Prometheus runs outside that network, publish 8089 on 127.0.0.1 only.

scrape_configs:
  - job_name: z2m-guard
    scrape_interval: 30s
    static_configs:
      - targets: ["172.22.1.51:8089"]