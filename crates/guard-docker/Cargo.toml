[package]
name = "guard-docker"
description = "Docker Engine event attribution for planned vs. crash restarts (opt-in)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Off by default: the Docker socket is root-equivalent host access.
docker-socket = []
# Reads `docker events --format '{{json .}}'` lines from stdin instead of the
# socket. No privileges, but the guard must then run on the host.
stdin = ["dep:tokio"]

[dependencies]
guard-core = { path = "../guard-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "rt", "sync"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "io-util"] }