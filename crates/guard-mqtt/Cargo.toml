[package]
name = "guard-mqtt"
description = "MQTT transport for z2m-guard: bridge state, publish, reconnect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
guard-core = { path = "../guard-core" }
# default-features = false drops rumqttc's `use-rustls`, which pulls
# rustls-webpki 0.102.8 — a branch that received no fix for the eight advisories
# filed in 2026 (fixes landed in 0.103.x only) — plus the unmaintained
# rustls-pemfile 2.2.0. The guard refuses `mqtts://` URLs by design
# (`parse_broker_url`), so that TLS stack was dead weight with a live CVE list,
# shipped in the binary and in the SBOM. Plain TCP to the broker is the supported
# transport; TLS support would need an upstream rumqttc release on webpki 0.103.
rumqttc = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
