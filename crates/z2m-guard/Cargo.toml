[package]
name = "z2m-guard"
description = "Separates planned Zigbee2MQTT restarts from real outages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "z2m-guard"
path = "src/main.rs"

[features]
default = []
docker = ["guard-docker/docker-socket"]
# Host mode: parse `docker events --format '{{json .}}'` piped on stdin.
stdin-events = ["guard-docker/stdin"]
proxy = ["guard-proxy/proxy"]

[dependencies]
guard-core = { path = "../guard-core" }
guard-ha = { path = "../guard-ha" }
guard-mqtt = { path = "../guard-mqtt" }
guard-docker = { path = "../guard-docker" }
guard-proxy = { path = "../guard-proxy" }

anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
rumqttc = { version = "0.25", default-features = false }  # no TLS, see guard-mqtt/Cargo.toml
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net"] }
toml = "1.2"
tower-http = { version = "0.7", features = ["timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Router-level tests: `oneshot` drives the real axum stack without a listener.
tower = { version = "0.5", features = ["util"] }
