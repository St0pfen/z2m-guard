[package]
name = "z2m-guard"
description = "Separates planned Zigbee2MQTT restarts from real outages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "z2m-guard"
path = "src/main.rs"

[features]
default = []
docker = ["guard-docker/docker-socket"]
proxy = ["guard-proxy/proxy"]

[dependencies]
guard-core = { path = "../guard-core" }
guard-ha = { path = "../guard-ha" }
guard-mqtt = { path = "../guard-mqtt" }
guard-docker = { path = "../guard-docker" }
guard-proxy = { path = "../guard-proxy" }

anyhow = "1"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
rumqttc = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }